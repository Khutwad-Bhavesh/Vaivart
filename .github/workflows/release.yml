name: Build and Release Vaivart

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux Packages (.tar.gz & .deb)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev ninja-build clang cmake dpkg-dev

      - name: Fetch Flutter pub dependencies
        run: flutter pub get

      - name: Build Linux release binary
        run: flutter build linux --release

      - name: Create Linux Tarball (.tar.gz)
        run: |
          cd build/linux/x64/release
          tar -czf Vaivart-linux-x64.tar.gz bundle/

      - name: Build Debian Package (.deb)
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          VERSION=${VERSION:-1.0.0}

          mkdir -p deb_tmp/usr/bin
          mkdir -p deb_tmp/usr/lib/vaivart
          mkdir -p deb_tmp/usr/share/applications
          mkdir -p deb_tmp/usr/share/pixmaps
          mkdir -p deb_tmp/DEBIAN

          cp -r build/linux/x64/release/bundle/* deb_tmp/usr/lib/vaivart/
          ln -s /usr/lib/vaivart/vaivart deb_tmp/usr/bin/vaivart
          cp assets/icons/icon_128.png deb_tmp/usr/share/pixmaps/vaivart.png

          cat <<EOF > deb_tmp/usr/share/applications/vaivart.desktop
          [Desktop Entry]
          Name=Vaivart
          Comment=Free, offline file converter. No ads, no watermarks.
          Exec=/usr/bin/vaivart
          Icon=vaivart
          Terminal=false
          Type=Application
          Categories=Utility;FileTools;
          EOF

          cat <<EOF > deb_tmp/DEBIAN/control
          Package: vaivart
          Version: ${VERSION}
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: Bhavesh Khutwad
          Description: Free, offline, open-source file converter.
           Vaivart is a desktop file converter optimized for low-end hardware.
          EOF

          dpkg-deb --build deb_tmp Vaivart-linux-amd64.deb

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: |
            build/linux/x64/release/Vaivart-linux-x64.tar.gz
            Vaivart-linux-amd64.deb

  build-windows:
    name: Build Windows Portable (.zip)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Fetch Flutter pub dependencies
        run: flutter pub get

      - name: Build Windows release binary
        run: flutter build windows --release

      - name: Package Windows Zip
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath Vaivart-windows-x64.zip

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: Vaivart-windows-x64.zip

  build-macos:
    name: Build macOS Application (.zip)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Fetch Flutter pub dependencies
        run: flutter pub get

      - name: Build macOS release binary
        run: flutter build macos --release

      - name: Package macOS App Zip
        run: |
          cd build/macos/Build/Products/Release
          zip -r Vaivart-macos.zip Vaivart.app

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: build/macos/Build/Products/Release/Vaivart-macos.zip

  release:
    name: Create GitHub Release
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Consolidate Release Files
        run: |
          mkdir -p release_dist
          find release-artifacts -type f \( -name "*.tar.gz" -o -name "*.deb" -o -name "*.zip" \) -exec cp {} release_dist/ \;
          ls -la release_dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_dist/*
          body: |
            ## Vaivart Release ${{ github.ref_name }} 🎉
            
            Free. Offline. Open source. Forever.
            
            ### Download Packages
            - **🐧 Linux (Debian / Ubuntu)**: `Vaivart-linux-amd64.deb`
            - **🐧 Linux (Portable Tarball)**: `Vaivart-linux-x64.tar.gz`
            - **🪟 Windows (Portable Zip)**: `Vaivart-windows-x64.zip`
            - **🍎 macOS (App Zip)**: `Vaivart-macos.zip`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
