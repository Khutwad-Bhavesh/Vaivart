name: vaivart
description: Vaivart — A free, offline, open-source file converter. No ads, no watermarks, no sign-in.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1
  file_picker: ^8.1.2
  shared_preferences: ^2.3.2
  path: ^1.9.0
  path_provider: ^2.1.5
  image: ^4.3.0
  pdf: ^3.12.0
  printing: ^5.14.3
  excel: ^4.0.2
  syncfusion_flutter_pdf: ^27.1.48
  ffmpeg_kit_flutter_audio: ^6.0.3   # ffmpeg compiled for Android (audio+video, no GPL)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/fonts/
